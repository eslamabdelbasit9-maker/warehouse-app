{%- elif name == 'archive' %}<rect x="2" y="3" width="20" height="5" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/>

{% macro card_h(ic, title, sub='') -%}
<div class="card-h"><span class="ic-chip">{{ icon(ic, 18) }}</span><div><h2>{{ title }}</h2>{% if sub %}<div class="muted">{{ sub }}</div>{% endif %}</div>{{ caller() if caller else '' }}</div>
{%- endmacro %}
