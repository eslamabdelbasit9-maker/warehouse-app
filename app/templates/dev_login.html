{% extends "base.html" %}
{% block body %}
<div class="card" style="max-width:460px;margin:60px auto;text-align:center">
  <img src="/static/logo.png" style="height:60px;background:#0B2A5B;padding:8px;border-radius:8px">
  <h1 style="margin-top:14px">{{ APP_NAME }}</h1>
  <p class="muted">دخول تجريبي (بيئة التطوير فقط). في التشغيل الفعلي يتم الدخول بحساب Microsoft 365.</p>
  <form method="post" class="row" style="justify-content:center">
    <select name="uid" required>
      {% for u in users %}<option value="{{ u.id }}">{{ u.name }} — {% for r in u.role_list %}{{ ROLES.get(r, r) }}{{ '، ' if not loop.last }}{% endfor %}</option>{% endfor %}
    </select>
    <button class="btn">دخول</button>
  </form>
</div>
{% endblock %}
