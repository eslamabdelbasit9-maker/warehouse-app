{% extends "base.html" %}
{% block body %}
<div class="card" style="max-width:420px;margin:60px auto;text-align:center">
  <img src="/static/logo.png" style="height:60px;background:#0B2A5B;padding:8px;border-radius:8px">
  <h1 style="margin-top:14px">{{ APP_NAME }}</h1>
  <form method="post" style="text-align:right">
    <div class="f"><label>الإيميل</label><input name="email" type="email" dir="ltr" required autofocus></div>
    <div class="f" style="margin-top:10px"><label>كلمة المرور</label><input name="password" type="password" dir="ltr" required></div>
    <button class="btn" style="width:100%;margin-top:14px">دخول</button>
  </form>
  <p class="muted">نسيت كلمة المرور؟ تواصل مع مدير النظام.</p>
</div>
{% endblock %}
