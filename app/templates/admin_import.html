{% extends "base.html" %}
{% block body %}
<h1>استيراد موقع من Excel</h1>
{% include "_admin_nav.html" %}
<form method="post" enctype="multipart/form-data" class="card">
  <p class="muted">ارفع ملف «منظومة المستودعات» للموقع (فيه شيتات الرصيد والوارد والصرف). يُستورد: الأصناف والرصيد الافتتاحي، الوارد، وطلبات الصرف السابقة. يتم مرة واحدة لكل موقع.</p>
  <div class="meta">
    <div class="f"><label>ملف Excel</label><input type="file" name="file" accept=".xlsx" required></div>
    <div class="f"><label>كود الموقع (بالإنجليزية، مختصر)</label><input name="site_code" dir="ltr" placeholder="NJR" required></div>
    <div class="f"><label>اسم الموقع</label><input name="site_name" placeholder="نجران" required></div>
  </div>
  <label style="display:flex;gap:8px;align-items:flex-start;margin-top:12px">
    <input type="checkbox" name="replace" value="1" id="rep">
    <span><b>استبدال بيانات الموقع الموجودة</b><br><span class="muted">يمسح النسخة اللي اتستوردت قبل كده للموقع ده (الأرصدة الافتتاحية، الوارد، وطلبات الصرف المستوردة) ويحط الملف الجديد مكانها. اللي اتعمل من جوه البرنامج ما بيتمسحش، والفواتير المرفوعة جوه البرنامج بترجع تتربط برقم الفاتورة.</span></span>
  </label>
  <button class="btn" style="margin-top:12px" onclick="if(document.getElementById('rep').checked&&!confirm('هيتمسح استيراد الموقع القديم ويتحط الملف الجديد. متأكد؟'))return false;this.textContent='جاري الاستيراد...'">استيراد</button>
</form>
{% endblock %}
