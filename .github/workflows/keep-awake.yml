# كان بيفتح البرنامج كل 5 دقايق علشان Render المجاني ما ينامش.
# اتوقف التشغيل التلقائي: بعد ما المستودع يبقى خاص، دقائق GitHub Actions المجانية محدودة (2000 دقيقة/شهر)
# والتشغيل كل 5 دقايق بيستهلكها في أسبوع وبيوقف النسخة الاحتياطية الأسبوعية.
# البديل: cron-job.org (مجاني) يفتح https://warehouse-app-9k24.onrender.com/healthz كل 10 دقايق.
name: keep-awake
on:
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://warehouse-app-9k24.onrender.com/healthz
